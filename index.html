<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LISTA KODÓW</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@100..900&family=Luckiest+Guy&family=Nunito:ital,wght@0,200..1000;1,200..1000&family=Ubuntu:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400;1,500;1,700&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: "Luckiest Guy", cursive;
    font-weight: 400;
	font-style: normal;
}

body {
    min-height: 100vh;
    background: linear-gradient(135deg, #050816, #0b1026, #101935);
    color: white;
    overflow-x: hidden;
}

body::before {
    content: "";
    position: fixed;
    inset: 0;
    background:
        radial-gradient(circle at top left, rgba(0,255,255,0.15), transparent 25%),
        radial-gradient(circle at bottom right, rgba(140,0,255,0.15), transparent 25%);
    z-index: -1;
}

.container {
    width: 90%;
    max-width: 1300px;
    margin: 40px auto;
}

.title {
    text-align: center;
    font-size: 3rem;
    margin-bottom: 30px;
    color: #00ffff;
    text-shadow: 0 0 15px #00ffff;
    letter-spacing: 4px;
}

.panel {
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.1);
    backdrop-filter: blur(12px);
    border-radius: 25px;
    padding: 25px;
    margin-bottom: 30px;
    box-shadow: 0 0 30px rgba(0,255,255,0.12);
}

.controls {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 20px;
}

input, select {
    padding: 15px;
    border-radius: 15px;
    border: 1px solid rgba(0,255,255,0.3);
    background: rgba(0,0,0,0.4);
    color: white;
    font-size: 1rem;
    outline: none;
    transition: 0.3s;
}

input:focus,
select:focus {
    border-color: #00ffff;
    box-shadow: 0 0 15px #00ffff;
}

.stats {
    margin-top: 20px;
    color: #a9cfff;
}

.cards {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 20px;
}

.card {
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 20px;
    padding: 20px;
    position: relative;
    overflow: hidden;
    transition: 0.3s;
}

.card::before {
    content: "";
    position: absolute;
    width: 200%;
    height: 200%;
    top: -50%;
    left: -50%;
    background: linear-gradient(45deg, transparent, rgba(0,255,255,0.15), transparent);
    transform: rotate(25deg);
}

.card:hover {
    transform: translateY(-8px);
    box-shadow: 0 0 25px rgba(0,255,255,0.25);
}

.word {
    font-size: 1.7rem;
    margin-bottom: 12px;
    color: #00ffff;
}

.info {
    margin: 8px 0;
    color: #d5d5d5;
}

.badge {
    display: inline-block;
    margin-top: 12px;
    padding: 6px 12px;
    border-radius: 999px;
    background: rgba(138,43,226,0.25);
    border: 1px solid #8a2be2;
    color: #d7b5ff;
}

.empty {
    text-align: center;
    padding: 40px;
    color: #aaa;
    font-size: 1.3rem;
}

@media(max-width: 600px) {
    .title {
        font-size: 2rem;
    }
}
</style>
</head>
<body>

<div class="container">

<h1 class="title">LISTA KODÓW</h1>

<div class="panel">
    <div class="controls">

        <input type="text" id="search" placeholder="Szukaj nazwy...">

        <input type="number" id="length" placeholder="Długość wyrazu...">

        <select id="category">
            <option value="">Wszystkie kategorie</option>
            <option value="rzecz">Rzecz</option>
            <option value="jedzenie">Jedzenie</option>
        </select>

    </div>

    <div class="stats" id="stats"></div>
</div>

<div class="cards" id="cards"></div>

</div>

<script>
const kody = [
    { nazwa: "biurko", length: 6, kategoria: "rzecz" },
    { nazwa: "burger", length: 6, kategoria: "jedzenie" },
    { nazwa: "butelka", length: 7, kategoria: "rzecz" },
    { nazwa: "drzwi", length: 5, kategoria: "rzecz" },
    { nazwa: "dzik", length: 4, kategoria: "rzecz" },
    { nazwa: "klawiatura", length: 10, kategoria: "rzecz" },
    { nazwa: "komputer", length: 8, kategoria: "rzecz" },
    { nazwa: "konsola", length: 7, kategoria: "rzecz" },
    { nazwa: "lama", length: 4, kategoria: "rzecz" },
    { nazwa: "lampa", length: 5, kategoria: "rzecz" },
    { nazwa: "lego", length: 4, kategoria: "rzecz" },
    { nazwa: "magnes", length: 6, kategoria: "rzecz" },
    { nazwa: "magnez", length: 6, kategoria: "rzecz" },
    { nazwa: "mango", length: 5, kategoria: "jedzenie" },
    { nazwa: "monitor", length: 7, kategoria: "rzecz" },
    { nazwa: "myszka", length: 6, kategoria: "rzecz" },
    { nazwa: "obraz", length: 5, kategoria: "rzecz" },
    { nazwa: "obudowa", length: 7, kategoria: "rzecz" },
    { nazwa: "okno", length: 4, kategoria: "rzecz" },
    { nazwa: "pingwin", length: 7, kategoria: "rzecz" },
    { nazwa: "puszka", length: 6, kategoria: "rzecz" },
    { nazwa: "spacja", length: 6, kategoria: "rzecz" },
    { nazwa: "szafka", length: 6, kategoria: "rzecz" },
    { nazwa: "szotek", length: 6, kategoria: "rzecz" },
    { nazwa: "tablica", length: 7, kategoria: "rzecz" },
    { nazwa: "tapeta", length: 6, kategoria: "rzecz" },
    { nazwa: "telefon", length: 7, kategoria: "rzecz" },
    { nazwa: "telewizor", length: 9, kategoria: "rzecz" },
    { nazwa: "truskawka", length: 9, kategoria: "jedzenie" },
    { nazwa: "woda", length: 4, kategoria: "jedzenie" }
];

const cards = document.getElementById("cards");
const search = document.getElementById("search");
const lengthInput = document.getElementById("length");
const category = document.getElementById("category");
const stats = document.getElementById("stats");

function renderData() {

    const searchValue = search.value.toLowerCase();
    const lengthValue = lengthInput.value;
    const categoryValue = category.value;

    const filtered = kody.filter(item => {

        const matchName = item.nazwa.toLowerCase().includes(searchValue);

        const matchLength = lengthValue === "" || item.length == lengthValue;

        const matchCategory = categoryValue === "" || item.kategoria === categoryValue;

        return matchName && matchLength && matchCategory;
    });

    cards.innerHTML = "";

    stats.innerHTML = `Znaleziono wyników: ${filtered.length}`;

    if(filtered.length === 0) {
        cards.innerHTML = `<div class="empty">Brak wyników...</div>`;
        return;
    }

    filtered.forEach(item => {

        cards.innerHTML += `
            <div class="card">
                <div class="word">${item.nazwa}</div>
                <div class="info"><b>Długość:</b> ${item.length}</div>
                <div class="badge">${item.kategoria}</div>
            </div>
        `;
    });
}

search.addEventListener("input", renderData);
lengthInput.addEventListener("input", renderData);
category.addEventListener("change", renderData);

renderData();
</script>

</body>
</html>
